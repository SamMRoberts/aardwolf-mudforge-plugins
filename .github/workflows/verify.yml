name: Repository verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and committed artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pull request merge result
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whitespace in the pull request diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$PR_BASE_SHA" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Report runtime versions
        run: |
          node --version
          npm --version
          python3 --version

      - name: Install locked dependencies
        run: npm ci

      # Compare the committed bytes before tests; never regenerate them in CI.
      - name: Check committed generated artifacts
        run: npm run build:check

      - name: Run Node.js and Python tests
        run: npm test
